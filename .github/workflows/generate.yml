name: Generate Blog Post

on:
  schedule:
    # Every Thursday at 2pm UTC
    - cron: '0 14 * * 4'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to write about'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pick a topic
        id: topic
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            TOPIC="${{ github.event.inputs.topic }}"
          else
            # Pick a random topic from the backlog
            TOPIC=$(npx yaml eval config/topics.yml | jq -r '.backlog[0]' 2>/dev/null || echo '')
            if [ -z "$TOPIC" ]; then
              echo "No topics in backlog. Skipping."
              exit 1
            fi
          fi
          echo "topic=$TOPIC" >> $GITHUB_OUTPUT

      - name: Draft post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run draft -- --topic "${{ steps.topic.outputs.topic }}" --quiet

      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'Draft: ${{ steps.topic.outputs.topic }}'
          title: 'Draft: ${{ steps.topic.outputs.topic }}'
          body: |
            ## Generated by: generate.yml

            This post was auto-generated by the blog pipeline.

            ### Review Checklist
            - [ ] Title is accurate and engaging
            - [ ] Content is factually correct
            - [ ] No unsupported claims (check frontmatter)
            - [ ] Images / diagrams are needed? (if so, edit manually)
            - [ ] Links work and are relevant
            - [ ] Ready to publish (approve by merging)
          branch: post/${{ steps.topic.outputs.topic }}
          delete-branch: true
          labels: auto-generated
